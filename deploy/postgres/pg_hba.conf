# Local bootstrap and health.
local   all             all                                     trust

# Same-VPS Docker networks may use private plaintext transport.
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# Never expose emergency/bootstrap or management identities publicly.
hostssl all             postgres        0.0.0.0/0               reject
hostssl all             platform_controller 0.0.0.0/0           reject

# Public application connections must use TLS + SCRAM.
hostssl all             all             0.0.0.0/0               scram-sha-256
hostnossl all           all             0.0.0.0/0               reject

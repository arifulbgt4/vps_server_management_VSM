services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.38.7}
    container_name: n8n
    restart: unless-stopped
    entrypoint: ["tini", "--", "/opt/n8n/entrypoint.sh"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n_app}
      DB_POSTGRESDB_SCHEMA: public

      N8N_HOST: ${N8N_HOST:?set N8N_HOST in .env}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: "1"

      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Dhaka}
      TZ: ${TZ:-Asia/Dhaka}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_LOG_OUTPUT: console

      N8N_UNVERIFIED_PACKAGES_ENABLED: ${N8N_UNVERIFIED_PACKAGES_ENABLED:-false}
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-300}
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: ${N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES:-2147483648}
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: ${N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES:-5000}

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_DATA_MAX_AGE:-336}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${N8N_EXECUTIONS_DATA_PRUNE_MAX_COUNT:-10000}

      N8N_DB_PASSWORD_FILE: /run/secrets/db_password
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key

    ports:
      - "127.0.0.1:${N8N_BIND_PORT:-5678}:5678"

    volumes:
      - type: bind
        source: ./data
        target: /home/node/.n8n
        bind:
          create_host_path: false
      - type: bind
        source: ./entrypoint.sh
        target: /opt/n8n/entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/db_password
        target: /run/secrets/db_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/encryption_key
        target: /run/secrets/encryption_key
        read_only: true
        bind:
          create_host_path: false

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      postgres_net:
      media_net:

networks:
  postgres_net:
    external: true
  media_net:
    external: true

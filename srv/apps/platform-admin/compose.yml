services:
  platform-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platform-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      AUTH_SESSION_SECRET_FILE: /run/secrets/auth_session_secret
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: platform_controller
      PG_PASSWORD_FILE: /run/secrets/platform_controller_password
      PG_PUBLIC_HOST: ${PG_PUBLIC_HOST:-db.openmusk.store}
      PG_PUBLIC_PORT: ${PG_PUBLIC_PORT:-5432}
      PG_PUBLIC_SSLMODE: ${PG_PUBLIC_SSLMODE:-verify-full}
      PLATFORM_DB_NAME: platform_admin
      PLATFORM_DB_USER: platform_app
      PLATFORM_DB_PASSWORD_FILE: /run/secrets/platform_app_password
      CREDENTIAL_VAULT_KEY_FILE: /run/secrets/credential_vault_key
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: platform_controller
      REDIS_PASSWORD_FILE: /run/secrets/redis_controller_password
      REDIS_APP_HOST: redis
      REDIS_APP_PORT: 6379
      REDIS_APP_DATABASE: 0
      REDIS_PUBLIC_HOST: ${REDIS_PUBLIC_HOST:-redis.openmusk.store}
      REDIS_PUBLIC_PORT: ${REDIS_PUBLIC_PORT:-6380}
      MYSQL_HOST: ${MYSQL_HOST:-mysql.openmusk.store}
      MYSQL_PORT: 3306
      MYSQL_CONTROLLER_USER: platform_controller
      MYSQL_CONTROLLER_PASSWORD_FILE: /run/secrets/mysql_controller_password
      MYSQL_TLS_ENABLED: "true"
      MYSQL_APP_HOST: ${MYSQL_APP_HOST:-mysql}
      MYSQL_APP_PORT: 3306
      MYSQL_PUBLIC_HOST: ${MYSQL_PUBLIC_HOST:-mysql.openmusk.store}
      MYSQL_PUBLIC_PORT: ${MYSQL_PUBLIC_PORT:-3306}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_CONTROLLER_USER: platform_controller
      MONGO_CONTROLLER_PASSWORD_FILE: /run/secrets/mongo_controller_password
      MONGO_APP_HOST: mongodb
      MONGO_APP_PORT: 27017
      MONGO_REPLICA_SET: rs0
      MONGO_PUBLIC_HOST: ${MONGO_PUBLIC_HOST:-mongo.openmusk.store}
      MONGO_PUBLIC_PORT: ${MONGO_PUBLIC_PORT:-27017}
      DOCKER_AGENT_URL: http://docker-agent:8080
      DOCKER_AGENT_TOKEN_FILE: /run/secrets/docker_agent_token
      MEDIA_SERVICE_URL: http://media-service:8080
      MEDIA_ADMIN_TOKEN_FILE: /run/secrets/media_admin_token
    ports:
      - "127.0.0.1:${PLATFORM_ADMIN_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: /srv/infrastructure/databases/postgres/secrets/platform_controller_password
        target: /run/secrets/platform_controller_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/infrastructure/databases/postgres/secrets/platform_app_password
        target: /run/secrets/platform_app_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/infrastructure/cache/redis/secrets/platform_controller_password
        target: /run/secrets/redis_controller_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/mysql_controller_password
        target: /run/secrets/mysql_controller_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/mongo_controller_password
        target: /run/secrets/mongo_controller_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/docker_agent_token
        target: /run/secrets/docker_agent_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/media_admin_token
        target: /run/secrets/media_admin_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/admin_password_hash
        target: /run/secrets/admin_password_hash
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/auth_session_secret
        target: /run/secrets/auth_session_secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/credential_vault_key
        target: /run/secrets/credential_vault_key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - proxy_net
      - postgres_net
      - redis_net
      - mysql_net
      - mongo_net
      - management_net
      - media_net

networks:
  proxy_net:
    external: true
  postgres_net:
    external: true
  redis_net:
    external: true
  mysql_net:
    external: true
  mongo_net:
    external: true
  management_net:
    external: true
  media_net:
    external: true

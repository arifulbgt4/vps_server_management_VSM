services:
  platform-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platform-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${PLATFORM_ADMIN_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - proxy_net
      - postgres_net

networks:
  proxy_net:
    external: true
  postgres_net:
    external: true

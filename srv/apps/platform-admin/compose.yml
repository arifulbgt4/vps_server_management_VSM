services:
  platform-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platform-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      AUTH_SESSION_SECRET_FILE: /run/secrets/auth_session_secret
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: platform_controller
      PG_PASSWORD_FILE: /run/secrets/platform_controller_password
    ports:
      - "127.0.0.1:${PLATFORM_ADMIN_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: /srv/infrastructure/databases/postgres/secrets/platform_controller_password
        target: /run/secrets/platform_controller_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/admin_password_hash
        target: /run/secrets/admin_password_hash
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/auth_session_secret
        target: /run/secrets/auth_session_secret
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - proxy_net
      - postgres_net

networks:
  proxy_net:
    external: true
  postgres_net:
    external: true

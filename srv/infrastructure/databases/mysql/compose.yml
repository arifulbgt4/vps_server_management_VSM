services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: platform-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Dhaka}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password
      MYSQL_ROOT_HOST: localhost
      MYSQL_CONTROLLER_USER: ${MYSQL_CONTROLLER_USER:-platform_controller}
    command:
      - mysqld
      - --bind-address=0.0.0.0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-150}
      - --ssl-ca=/run/tls/chain.pem
      - --ssl-cert=/run/tls/fullchain.pem
      - --ssl-key=/run/tls/privkey.pem
      - --require-secure-transport=ON
    ports:
      - "${MYSQL_BIND_IP:-0.0.0.0}:${MYSQL_PUBLIC_PORT:-3306}:3306"
    volumes:
      - type: bind
        source: ./data
        target: /var/lib/mysql
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/root_password
        target: /run/secrets/root_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/controller_password
        target: /run/secrets/controller_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/init-controller.sh
        target: /docker-entrypoint-initdb.d/20-platform-controller.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tls/fullchain.pem
        target: /run/tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tls/chain.pem
        target: /run/tls/chain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tls/privkey.pem
        target: /run/tls/privkey.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$(cat /run/secrets/root_password) mysqladmin --protocol=socket -uroot ping --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      mysql_net:
        aliases:
          - mysql
          - ${MYSQL_PUBLIC_HOST:-mysql.openmusk.store}

networks:
  mysql_net:
    external: true

services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: platform-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Dhaka}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password
    command:
      - mysqld
      - --bind-address=0.0.0.0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-150}
    volumes:
      - type: bind
        source: ./data
        target: /var/lib/mysql
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/root_password
        target: /run/secrets/root_password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$(cat /run/secrets/root_password) mysqladmin ping -h 127.0.0.1 -uroot --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      mysql_net:
        aliases:
          - mysql

  mysql-init:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: platform-mysql-init
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/vsm-mysql-init.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_CONTROLLER_USER: ${MYSQL_CONTROLLER_USER:-platform_controller}
    volumes:
      - type: bind
        source: ./scripts/init-controller.sh
        target: /usr/local/bin/vsm-mysql-init.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/root_password
        target: /run/secrets/root_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/controller_password
        target: /run/secrets/controller_password
        read_only: true
        bind:
          create_host_path: false
    networks:
      mysql_net:

networks:
  mysql_net:
    external: true

# PostgreSQL authentication policy

# Emergency postgres access through Unix socket
local   all             postgres                                trust

# Other local users require SCRAM password
local   all             all                                     scram-sha-256

# Localhost
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Same-VPS Docker applications on postgres_net
host    all             all             172.19.0.0/16           scram-sha-256

# Never expose management/system databases remotely
hostssl postgres        all             0.0.0.0/0               reject
hostssl platform_admin  all             0.0.0.0/0               reject
hostssl postgres        all             ::0/0                    reject
hostssl platform_admin  all             ::0/0                    reject

# Never allow management roles to authenticate from the public network
hostssl all             postgres,platform_controller,platform_app 0.0.0.0/0 reject
hostssl all             postgres,platform_controller,platform_app ::0/0      reject

# Remote application roles: TLS + SCRAM only
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::0/0                    scram-sha-256

# Explicitly reject public non-TLS connections
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::0/0                    reject

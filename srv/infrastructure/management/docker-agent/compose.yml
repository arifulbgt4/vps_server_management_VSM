services:
  docker-agent:
    image: node:22-alpine
    container_name: platform-docker-agent
    restart: unless-stopped
    # The agent needs to read a host-owned 0600 token and the root-owned
    # Docker Unix socket. It is intentionally isolated on management_net,
    # has no published port, drops Linux capabilities, and enforces an
    # explicit container allowlist in agent.mjs.
    user: "0:0"
    command: ["node", "/app/agent.mjs"]
    environment:
      PORT: 8080
      DOCKER_AGENT_TOKEN_FILE: /run/secrets/control_token
      DOCKER_AGENT_LIMITS_FILE: /data/resource-limits.json
      DOCKER_AGENT_HOST_PROC_PATH: /host/proc
      DOCKER_AGENT_HOST_STORAGE_PATH: /host/storage
      DOCKER_AGENT_ALLOWLIST: ${DOCKER_AGENT_ALLOWLIST:-platform-admin,platform-postgres,platform-redis,n8n}
    volumes:
      - type: bind
        source: ./agent.mjs
        target: /app/agent.mjs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ./secrets/control_token
        target: /run/secrets/control_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv
        target: /host/storage
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      management_net:
        aliases:
          - docker-agent

networks:
  management_net:
    external: true

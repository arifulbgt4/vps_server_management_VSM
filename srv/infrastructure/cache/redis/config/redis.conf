bind 0.0.0.0
protected-mode yes

# Private same-VPS Docker traffic.
port 6379

# Public TLS-only listener. Publish only this port externally.
tls-port 6380
tls-cert-file /etc/redis/tls/server.crt
tls-key-file /etc/redis/tls/server.key
tls-ca-cert-file /etc/ssl/certs/ca-certificates.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"

tcp-keepalive 300
timeout 0

appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

dir /data
aclfile /data/users.acl

loglevel notice

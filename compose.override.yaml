services:
  automation-api:
    environment:
      N8N_WORKFLOW_BUNDLE_VERSION: ${AUTOMATION_N8N_BUNDLE_VERSION:-2.0.0}

  automation-worker:
    environment:
      N8N_WORKFLOW_BUNDLE_VERSION: ${AUTOMATION_N8N_BUNDLE_VERSION:-2.0.0}

  n8n:
    environment:
      # Bundle 2 workflows intentionally reference a small set of platform-owned
      # environment variables. n8n 2.x blocks $env access unless explicitly allowed.
      # Keep n8n editor access restricted to trusted platform administrators.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SAAS_API_INTERNAL_URL: http://automation-api:4000
      N8N_INTERNAL_WEBHOOK_BASE_URL: http://n8n:5678
      N8N_WORKFLOW_BUNDLE_VERSION: ${AUTOMATION_N8N_BUNDLE_VERSION:-2.0.0}

  n8n-worker:
    environment:
      # Queue-mode executions happen in n8n-worker, so it must receive the same
      # workflow runtime variables as the n8n main process.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SAAS_API_INTERNAL_URL: http://automation-api:4000
      N8N_INTERNAL_WEBHOOK_BASE_URL: http://n8n:5678
      N8N_WORKFLOW_BUNDLE_VERSION: ${AUTOMATION_N8N_BUNDLE_VERSION:-2.0.0}
